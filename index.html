<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Ship Search</title>

<link rel="icon" type="image/png" href="https://upload.meeshosupplyassets.com/cataloging/1786017956192/IMG_20260806_173023.png">
<link rel="apple-touch-icon" href="https://upload.meeshosupplyassets.com/cataloging/1786017956192/IMG_20260806_173023.png">
<meta name="theme-color" content="#000000">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{font-family:'Inter',sans-serif}
  @keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes scaleIn { from{transform:scale(0.95); opacity:0;} to{transform:scale(1); opacity:1;} }
  .animate-slideUp{animation:slideUp 0.35s cubic-bezier(0.16,1,0.3,1)}
  .animate-fadeIn{animation:fadeIn 0.4s ease-out forwards}
  .animate-scaleIn{animation:scaleIn 0.3s cubic-bezier(0.16,1,0.3,1)}
  .glass{backdrop-filter:blur(12px); background:rgba(255,255,255,0.85)}
  .shimmer{position:relative; overflow:hidden}
  .shimmer:after{content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent); animation:shimmer 2s infinite}
  @keyframes shimmer{100%{left:100%}}
</style>
</head>
<body class="bg-[#fcfcfd] min-h-screen selection:bg-black selection:text-white">
<!-- Header with Logo -->
<div class="sticky top-0 z-30 glass border-b border-gray-100">
  <div class="max-w-[720px] mx-auto px-4 py-3.5 flex items-center gap-3">
    <img src="https://upload.meeshosupplyassets.com/cataloging/1786017956192/IMG_20260806_173023.png" class="w-10 h-10 rounded-xl object-contain bg-white border shadow-sm" onerror="this.style.display='none'">
    <div>
      <h1 class="text-[16px] font-extrabold tracking-tight leading-none">PRODUCT SHIP</h1>
      <p class="text-[11px] text-gray-400 font-medium tracking-wide mt-0.5">INVENTORY SEARCH</p>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
      <span class="text-[11px] font-semibold text-gray-500">LIVE</span>
    </div>
  </div>
</div>

<div class="max-w-[720px] mx-auto px-4 py-5">
  <!-- Search Card -->
  <div class="bg-white rounded-[20px] p-1 shadow-[0_8px_30px_rgba(0,0,0,0.04)] border border-gray-100">
    <div class="relative">
      <div class="absolute left-4 top-1/2 -translate-y-1/2 w-9 h-9 bg-black rounded-full flex items-center justify-center text-white">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <input id="searchInput" type="text" placeholder="Product name likho..." 
        class="w-full pl-[60px] pr-5 py-[18px] bg-transparent rounded-[16px] text-[15px] font-medium placeholder:text-gray-400 focus:outline-none">
    </div>
  </div>

  <div id="count" class="text-[12px] font-semibold text-gray-400 mt-4 mb-2 px-1 tracking-wide uppercase"></div>

  <div id="productList" class="space-y-3"></div>

  <div id="empty" class="hidden text-center py-20 animate-fadeIn">
    <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto text-2xl">📦</div>
    <p class="font-bold mt-4">Product nahi mila</p>
    <p class="text-sm text-gray-400 mt-1">Spelling check karo ya dusra naam try karo</p>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 hidden z-50">
  <div id="backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-[6px] opacity-0 transition-opacity duration-300"></div>
  <div id="sheet" class="absolute bottom-0 left-0 right-0 md:bottom-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-[660px] bg-white md:rounded-[28px] rounded-t-[32px] max-h-[92vh] overflow-hidden shadow-[0_20px_80px_rgba(0,0,0,0.2)] translate-y-full md:translate-y-0 md:scale-95 md:opacity-0 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col">
    <div class="w-10 h-1.5 bg-gray-200 rounded-full mx-auto mt-3.5 mb-1 md:hidden"></div>
    <div class="p-6 md:p-7 overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
          <img src="https://upload.meeshosupplyassets.com/cataloging/1786017956192/IMG_20260806_173023.png" class="w-8 h-8 rounded-lg border object-contain">
          <h2 class="font-bold text-[16px]">Product Details</h2>
        </div>
        <button onclick="closeModal()" class="w-9 h-9 bg-gray-100 hover:bg-black hover:text-white rounded-full flex items-center justify-center transition-colors">✕</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-[13px] font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all translate-y-2 z-[60]">Copied!</div>

<script>
let products=[], filtered=[];

async function loadProducts(){
  try{
    // Cache buster lagaya hai taaki naya data turant dikhe
    const res = await fetch('./Product_Ship.txt?v=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    console.log('Loaded txt length:', text.length);
    products = JSON.parse(text);
    filtered = products;
    render();
    console.log('Products loaded:', products.length);
  }catch(e){
    console.error('Load error:', e);
    try {
      // Fallback: try lowercase filename
      const res2 = await fetch('./product_ship.txt?v=' + Date.now(), { cache: 'no-store' });
      if(res2.ok){
        products = await res2.json();
        filtered = products;
        render();
        return;
      }
    } catch(e2){}
    document.getElementById('productList').innerHTML='<div class="bg-red-50 border border-red-100 text-red-600 text-sm p-4 rounded-2xl"><b>Product_Ship.txt load nahi hua.</b><br><br>Error: '+e.message+'<br><br>Check:<br>1. File naam exactly <b>Product_Ship.txt</b> hona chahiye (capital P aur S)<br>2. Same folder me hona chahiye jaha index.html hai<br>3. GitHub pe hard refresh karo: Ctrl+Shift+R</div>';
  }
}

function copyBtn(value, label){
  return `<button onclick="copyText('${value}', '${label}')" class="ml-auto group flex items-center gap-1 text-[11px] font-bold px-2.5 py-1 bg-white border border-gray-200 rounded-full hover:bg-black hover:text-white hover:border-black transition-all active:scale-95">
    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
    COPY
  </button>`;
}

function detailRow(label, value, mono=false){
  return `<div class="group flex items-center gap-3 bg-[#f8f8f9] hover:bg-gray-100 rounded-2xl p-4 transition-colors">
    <div class="flex-1 min-w-0">
      <p class="text-[10px] font-bold tracking-widest text-gray-400 uppercase">${label}</p>
      <p class="font-semibold text-[14px] mt-1 ${mono?'font-mono':''} truncate">${value}</p>
    </div>
    ${copyBtn(value, label)}
  </div>`;
}

function render(){
  const list=document.getElementById('productList');
  const count=document.getElementById('count');
  const empty=document.getElementById('empty');
  if(filtered.length===0){
    list.innerHTML=''; empty.classList.remove('hidden'); count.textContent=''; return;
  }
  empty.classList.add('hidden');
  count.textContent = `${filtered.length} Products • Smooth Search`;
  list.innerHTML = filtered.map((p,i)=>`
    <div onclick="openModal(${p.id})" style="animation-delay:${i*40}ms" class="animate-fadeIn group bg-white border border-gray-100 rounded-[20px] p-3.5 flex items-center gap-3.5 cursor-pointer hover:shadow-[0_10px_30px_rgba(0,0,0,0.06)] hover:border-gray-200 hover:-translate-y-[1px] active:scale-[0.99] transition-all duration-300">
      <div class="flex-1 min-w-0">
        <p class="font-bold text-[14.5px] text-gray-900 leading-tight group-hover:text-black">${p.productName}</p>
        <p class="text-[12px] text-gray-500 mt-1 truncate">${p.alternateName||''}</p>
        <div class="flex gap-2 mt-2">
          <span class="text-[10px] font-bold bg-black text-white px-2 py-1 rounded-full">${p.hsnCode}</span>
          <span class="text-[10px] font-medium bg-gray-100 px-2 py-1 rounded-full">${p.weight}</span>
        </div>
      </div>
      <div class="relative">
        <img src="${p.image}" class="w-[64px] h-[64px] rounded-[14px] object-cover bg-gray-50 border border-gray-100 group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://via.placeholder.com/100'">
        <div class="absolute -top-1 -right-1 w-5 h-5 bg-white border shadow-sm rounded-full flex items-center justify-center text-[10px]">↗</div>
      </div>
    </div>
  `).join('');
}

function openModal(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  document.getElementById('modalContent').innerHTML=`
    <div class="flex flex-col md:flex-row gap-6">
      <div class="flex-1 order-2 md:order-1 space-y-3">
        <div class="bg-black text-white rounded-[20px] p-5">
          <p class="text-[10px] tracking-widest opacity-60 uppercase font-bold">Product Name</p>
          <p class="text-[18px] font-extrabold mt-1 leading-tight">${p.productName}</p>
          <p class="text-sm opacity-70 mt-1">${p.unit} • ${p.category||''}</p>
        </div>
        ${detailRow('Alternate Product Name', p.alternateName)}
        ${detailRow('HSN Code', p.hsnCode, true)}
        ${detailRow('Weight', p.weight)}
        ${detailRow('Dimension', p.dimension)}
        ${detailRow('Unit Price', '₹ '+p.unitPrice, true)}
        ${detailRow('Unit / Packing', p.unit)}
      </div>
      <div class="order-1 md:order-2">
        <div class="md:w-[220px] w-full aspect-square rounded-[20px] overflow-hidden bg-[#f8f8f9] border border-gray-100 p-2">
          <img src="${p.image}" class="w-full h-full object-cover rounded-[14px]" style="aspect-ratio:1/1" onerror="this.src='https://via.placeholder.com/500'">
        </div>
        <div class="mt-3 bg-gray-50 rounded-full px-3 py-2 flex items-center justify-center gap-2 text-[11px] font-medium text-gray-500">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> 5000×5000 • 1:1 • HD
        </div>
      </div>
    </div>
  `;
  const modal=document.getElementById('modal');
  const backdrop=document.getElementById('backdrop');
  const sheet=document.getElementById('sheet');
  modal.classList.remove('hidden');
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{
    backdrop.classList.remove('opacity-0');
    sheet.classList.remove('translate-y-full','md:scale-95','md:opacity-0');
  });
}

function closeModal(){
  const backdrop=document.getElementById('backdrop');
  const sheet=document.getElementById('sheet');
  backdrop.classList.add('opacity-0');
  sheet.classList.add('translate-y-full','md:scale-95','md:opacity-0');
  setTimeout(()=>{
    document.getElementById('modal').classList.add('hidden');
    document.body.style.overflow='';
  },300);
}

function copyText(t,label){
  navigator.clipboard.writeText(t);
  const toast=document.getElementById('toast');
  toast.textContent = label+' copied: '+t;
  toast.classList.remove('opacity-0','translate-y-2');
  toast.classList.add('opacity-100','translate-y-0');
  setTimeout(()=>{ toast.classList.add('opacity-0','translate-y-2'); toast.classList.remove('opacity-100','translate-y-0'); },1800);
  if(navigator.vibrate) navigator.vibrate(20);
}

document.getElementById('searchInput').addEventListener('input',(e)=>{
  const q=e.target.value.toLowerCase().trim();
  filtered = !q ? products : products.filter(p=> (p.productName+' '+(p.alternateName||'')+' '+p.searchKeyword).toLowerCase().includes(q));
  render();
});
loadProducts();
</script>
</body>
</html>
